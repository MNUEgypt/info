  <style>

    :root {
      --main-color: #0c1e3e;
      --accent-color: #c39a44;
      --text-light: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--main-color);
      color: var(--text-light);
      padding: 20px;
      text-align: center;
      margin: 0;
    }

    .profile-img {
      width: 110px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
    }

    .username {
      font-weight: bold;
      font-size: 1.3em;
      margin: 10px 0 5px;
    }

    .title {
      font-size: 1em;
      margin-bottom: 20px;
      color: #ddd;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1em;
      transition:
        background 0.3s,
        border 0.3s,
        transform 0.2s;
      border: 2px solid var(--accent-color);
      background-color: #ffffff;
      color: var(--main-color);
      margin-bottom: 0;
    }

    .link-button:hover {
      background-color: #f2f2f2;
      transform: translateY(-2px);
    }

    .link-icon {
      width: 24px;
    }

    .section-title {
      margin-top: 30px;
      font-weight: bold;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px auto;
      max-width: 900px;
      flex-wrap: wrap;
    }

    .contact-links .link-button {
      flex: 1;
      min-width: 200px;
      text-align: center;
      max-width: 250px;
    }

    .social-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 800px;
      margin: 20px auto;
    }

    .social-links .full-width {
      grid-column: span 2;
      justify-content: center;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85em;
      color: #ccc;
      padding-bottom: 20px;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
    }


    /* =========================================
       PREMIUM MANSNU SOUND BUTTON
       ========================================= */

    #soundControl {

      position: fixed;

      top: 20px;
      right: 20px;

      width: 50px;
      height: 50px;

      border-radius: 50%;

      border: 2px solid var(--accent-color);

      background:
        linear-gradient(
          145deg,
          #12284e,
          #07162f
        );

      color: var(--accent-color);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      z-index: 99999;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.35),
        inset 0 0 8px rgba(195, 154, 68, 0.15);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

      -webkit-tap-highlight-color: transparent;
    }


    #soundControl:hover {

      transform: scale(1.08);

      background:
        linear-gradient(
          145deg,
          #1b3867,
          #0b1d3c
        );

      box-shadow:
        0 7px 25px rgba(0, 0, 0, 0.4),
        0 0 15px rgba(195, 154, 68, 0.35);
    }


    #soundControl:active {
      transform: scale(0.94);
    }

    #soundControl svg {

      width: 23px;
      height: 23px;

      fill: currentColor;

      pointer-events: none;
    }


    /* =========================================
       MUSIC PLAYING ANIMATION
       ========================================= */

    #soundControl.playing {

      animation: soundPulse 2.2s infinite;
    }


    @keyframes soundPulse {

      0% {

        box-shadow:
          0 5px 20px rgba(0, 0, 0, 0.35),
          0 0 0 0 rgba(195, 154, 68, 0.40);

      }

      70% {

        box-shadow:
          0 5px 20px rgba(0, 0, 0, 0.35),
          0 0 0 9px rgba(195, 154, 68, 0);

      }

      100% {

        box-shadow:
          0 5px 20px rgba(0, 0, 0, 0.35),
          0 0 0 0 rgba(195, 154, 68, 0);

      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      #soundControl {

        width: 44px;
        height: 44px;

        top: 15px;
        right: 15px;
      }

      #soundControl svg {

        width: 20px;
        height: 20px;
      }

      .contact-links {

        flex-direction: column;
        gap: 10px;
      }

      .contact-links .link-button {

        max-width: 100%;
      }

    }

  </style>

  <!-- =========================================
       SOUND CONTROL
       ========================================= -->

  <button
    id="soundControl"
    aria-label="Sound"
    title="Sound"
  >

    <svg
      id="soundIcon"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >

      <path d="M3 9v6h4l5 4V5L7 9H3z"></path>

      <path
        d="M14 8.5a1 1 0 0 1 1.5-.86
           5 5 0 0 1 0 8.72
           1 1 0 1 1-1-1.72
           3 3 0 0 0 0-5.28
           1 1 0 0 1-.5-.86z"
      ></path>

    </svg>

  </button>


  <!-- =========================================
       MUSIC SCRIPT
       ========================================= -->

  <script>

    window.addEventListener("load", function () {


      const music =
        document.getElementById("bgMusic");


      const soundControl =
        document.getElementById("soundControl");


      const soundIcon =
        document.getElementById("soundIcon");


      /* =====================================
         ICONS
         ===================================== */

      const speakerOn = `

        <path d="M3 9v6h4l5 4V5L7 9H3z"></path>

        <path
          d="M14 8.5a1 1 0 0 1 1.5-.86
             5 5 0 0 1 0 8.72
             1 1 0 1 1-1-1.72
             3 3 0 0 0 0-5.28
             1 1 0 0 1-.5-.86z"
        ></path>

      `;


      const speakerOff = `

        <path d="M3 9v6h4l5 4V5L7 9H3z"></path>

        <path
          d="M16 9l5 5m0-5l-5 5"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
        ></path>

      `;


      /* =====================================
         UPDATE BUTTON
         ===================================== */

      function updateButton() {

        if (!music.paused) {

          soundIcon.innerHTML =
            speakerOn;

          soundControl.classList.add(
            "playing"
          );

          soundControl.title =
            "Mute sound";

          soundControl.setAttribute(
            "aria-label",
            "Mute sound"
          );

        } else {

          soundIcon.innerHTML =
            speakerOff;

          soundControl.classList.remove(
            "playing"
          );

          soundControl.title =
            "Turn sound on";

          soundControl.setAttribute(
            "aria-label",
            "Turn sound on"
          );

        }

      }


      /* =====================================
         CHECK USER PREFERENCE
         ===================================== */

      const mutedByUser =
        localStorage.getItem(
          "mansnu_music_muted"
        );


      /* =====================================
         START MUSIC
         ===================================== */

      function startMusic() {


        /*
          If user previously muted the music,
          don't automatically start it.
        */

        if (mutedByUser === "true") {

          music.pause();

          updateButton();

          return;
        }


        music.volume = 1;


        const promise =
          music.play();


        if (promise !== undefined) {

          promise
            .then(function () {

              updateButton();

            })
            .catch(function () {

              /*
                Browser blocked autoplay.

                We wait for the first user
                interaction.
              */

              updateButton();

            });

        }

      }


      /* =====================================
         TRY AUTOPLAY IMMEDIATELY
         ===================================== */

      startMusic();


      /* =====================================
         FALLBACK FOR BROWSER AUTOPLAY BLOCK
         ===================================== */

      function userInteraction() {


        /*
          Don't start if user intentionally
          muted the music.
        */

        if (
          localStorage.getItem(
            "mansnu_music_muted"
          ) === "true"
        ) {

          return;

        }


        if (music.paused) {

          music.volume = 1;


          music.play()
            .then(function () {

              updateButton();

            })
            .catch(function () {});

        }

      }


      document.addEventListener(
        "click",
        userInteraction,
        { once: true }
      );


      document.addEventListener(
        "touchstart",
        userInteraction,
        { once: true }
      );


      document.addEventListener(
        "keydown",
        userInteraction,
        { once: true }
      );


      /* =====================================
         SOUND BUTTON
         ===================================== */

      soundControl.addEventListener(
        "click",
        function (event) {


          event.stopPropagation();


          if (music.paused) {


            music.volume = 1;


            music.play()
              .then(function () {


                localStorage.setItem(
                  "mansnu_music_muted",
                  "false"
                );


                updateButton();


              })
              .catch(function () {});


          } else {


            music.pause();


            localStorage.setItem(
              "mansnu_music_muted",
              "true"
            );


            updateButton();

          }

        }
      );


      /* =====================================
         MUSIC EVENTS
         ===================================== */

      music.addEventListener(
        "play",
        updateButton
      );


      music.addEventListener(
        "pause",
        updateButton
      );


      /* =====================================
         INITIAL STATE
         ===================================== */

      updateButton();


    });

  </script>
