<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mansoura National University</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <style>
    :root {
      --main-color: #0c1e3e;
      --accent-color: #c39a44;
      --text-light: #ffffff;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--main-color);
      color: var(--text-light);
      padding: 20px;
      text-align: center;
    }

    .profile-img {
      width: 110px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
    }

    .username {
      font-weight: bold;
      font-size: 1.3em;
      margin: 10px 0 5px;
    }

    .title {
      font-size: 1em;
      margin-bottom: 20px;
      color: #ddd;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1em;
      transition: background 0.3s, border 0.3s;
      border: 2px solid var(--accent-color);
      background-color: #ffffff;
      color: var(--main-color);
      box-sizing: border-box;
    }

    .link-button:hover {
      background-color: #f2f2f2;
    }

    .link-icon {
      width: 24px;
    }

    .section-title {
      margin-top: 30px;
      font-weight: bold;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px auto;
      max-width: 900px;
      flex-wrap: wrap;
    }

    .contact-links .link-button {
      flex: 1;
      min-width: 200px;
      text-align: center;
      max-width: 250px;
    }

    .social-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 800px;
      margin: 20px auto;
    }

    .social-links .full-width {
      grid-column: span 2;
      justify-content: center;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85em;
      color: #ccc;
    }

@media (max-width: 600px) {
  .contact-links {
    flex-direction: column;
    gap: 10px;
  }

  .contact-links .link-button {
    max-width: 100%;
  }
}

  </style>

</head>
