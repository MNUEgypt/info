  <style>
    :root {
      --main-color: #0c1e3e;
      --accent-color: #c39a44;
      --text-light: #ffffff;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--main-color);
      color: var(--text-light);
      padding: 20px;
      text-align: center;
    }

    .profile-img {
      width: 110px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
    }

    .username {
      font-weight: bold;
      font-size: 1.3em;
      margin: 10px 0 5px;
    }

    .title {
      font-size: 1em;
      margin-bottom: 20px;
      color: #ddd;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1em;
      transition: background 0.3s, border 0.3s, transform 0.2s;
      border: 2px solid var(--accent-color);
      background-color: #ffffff;
      color: var(--main-color);
      box-sizing: border-box;
    }

    .link-button:hover {
      background-color: #f2f2f2;
      transform: translateY(-2px);
    }

    .link-icon {
      width: 24px;
    }

    .section-title {
      margin-top: 30px;
      font-weight: bold;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px auto;
      max-width: 900px;
      flex-wrap: wrap;
    }

    .contact-links .link-button {
      flex: 1;
      min-width: 200px;
      text-align: center;
      max-width: 250px;
    }

    .social-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 800px;
      margin: 20px auto;
    }

    .social-links .full-width {
      grid-column: span 2;
      justify-content: center;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85em;
      color: #ccc;
    }

    /* =========================
       Premium Sound Button
       ========================= */

    #soundControl {
      position: fixed;
      top: 20px;
      right: 20px;

      width: 48px;
      height: 48px;

      border-radius: 50%;
      border: 2px solid var(--accent-color);

      background: rgba(12, 30, 62, 0.96);
      color: var(--accent-color);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      z-index: 9999;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.35),
        inset 0 0 8px rgba(195, 154, 68, 0.15);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    #soundControl:hover {
      transform: scale(1.08);
      background: rgba(195, 154, 68, 0.15);

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.4),
        0 0 12px rgba(195, 154, 68, 0.35);
    }

    #soundControl:active {
      transform: scale(0.95);
    }

    #soundControl svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Small animation while music is playing */

    #soundControl.playing {
      animation: soundPulse 2s infinite;
    }

    @keyframes soundPulse {
      0% {
        box-shadow:
          0 4px 15px rgba(0, 0, 0, 0.35),
          0 0 0 0 rgba(195, 154, 68, 0.35);
      }

      70% {
        box-shadow:
          0 4px 15px rgba(0, 0, 0, 0.35),
          0 0 0 8px rgba(195, 154, 68, 0);
      }

      100% {
        box-shadow:
          0 4px 15px rgba(0, 0, 0, 0.35),
          0 0 0 0 rgba(195, 154, 68, 0);
      }
    }

    @media (max-width: 600px) {

      .contact-links {
        flex-direction: column;
        gap: 10px;
      }

      .contact-links .link-button {
        max-width: 100%;
      }

      #soundControl {
        top: 15px;
        right: 15px;
        width: 44px;
        height: 44px;
      }
    }
  </style>

<!-- =========================
     Sound Control Button
     ========================= -->

<button id="soundControl"
        aria-label="Toggle sound"
        title="Turn sound on/off">

  <!-- Speaker Icon -->
  <svg id="soundIcon"
       viewBox="0 0 24 24"
       xmlns="http://www.w3.org/2000/svg">

    <path d="M3 9v6h4l5 4V5L7 9H3z"></path>

    <path d="M14 8.5a1 1 0 0 1 1.5-.86
             5 5 0 0 1 0 8.72
             1 1 0 1 1-1-1.72
             3 3 0 0 0 0-5.28
             1 1 0 0 1-.5-.86z">
    </path>

  </svg>

</button>


<script>

  window.addEventListener('load', function () {

    const music = document.getElementById('bgMusic');
    const soundControl = document.getElementById('soundControl');
    const soundIcon = document.getElementById('soundIcon');


    /* =========================
       Icons
       ========================= */

    const speakerOn = `
      <path d="M3 9v6h4l5 4V5L7 9H3z"></path>

      <path d="M14 8.5a1 1 0 0 1 1.5-.86
               5 5 0 0 1 0 8.72
               1 1 0 1 1-1-1.72
               3 3 0 0 0 0-5.28
               1 1 0 0 1-.5-.86z">
      </path>
    `;


    const speakerOff = `
      <path d="M3 9v6h4l5 4V5L7 9H3z"></path>

      <path d="M16 9l5 5m0-5l-5 5"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round">
      </path>
    `;


    /* =========================
       Update Button
       ========================= */

    function updateSoundButton() {

      if (!music.paused) {

        soundIcon.innerHTML = speakerOn;

        soundControl.classList.add('playing');

        soundControl.setAttribute(
          'aria-label',
          'Mute sound'
        );

        soundControl.setAttribute(
          'title',
          'Mute sound'
        );

      } else {

        soundIcon.innerHTML = speakerOff;

        soundControl.classList.remove('playing');

        soundControl.setAttribute(
          'aria-label',
          'Turn sound on'
        );

        soundControl.setAttribute(
          'title',
          'Turn sound on'
        );

      }

    }


    /* =========================
       Load music after page load
       ========================= */

    setTimeout(function () {

      music.load();

      music.play()
        .then(function () {

          updateSoundButton();

        })
        .catch(function () {

          /*
             Browser blocked autoplay.
             Music will start after first
             user interaction.
          */

          updateSoundButton();

        });

    }, 1000);


    /* =========================
       Sound Button
       ========================= */

    soundControl.addEventListener('click', function (event) {

      event.stopPropagation();

      if (music.paused) {

        music.play()
          .then(function () {

            updateSoundButton();

          })
          .catch(function () {

            updateSoundButton();

          });

      } else {

        music.pause();

        updateSoundButton();

      }

    });


    /* =========================
       Start after first interaction
       ========================= */

    function startMusicOnInteraction() {

      if (music.paused) {

        music.play()
          .then(function () {

            updateSoundButton();

          })
          .catch(function () {});

      }

      document.removeEventListener(
        'click',
        startMusicOnInteraction
      );

      document.removeEventListener(
        'touchstart',
        startMusicOnInteraction
      );

    }


    document.addEventListener(
      'click',
      startMusicOnInteraction,
      { once: true }
    );


    document.addEventListener(
      'touchstart',
      startMusicOnInteraction,
      { once: true }
    );


    /* =========================
       Keep button synchronized
       ========================= */

    music.addEventListener(
      'play',
      updateSoundButton
    );

    music.addEventListener(
      'pause',
      updateSoundButton
    );

  });

</script>
